[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemosyne-memory"
version = "0.1.0"
description = "A local-first memory compiler for AI agents based on the Mnemosyne v2 blueprint."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Mnemosyne Contributors" }]
dependencies = ["cryptography>=42"]
keywords = ["agent-memory", "retrieval", "belief-revision", "mcp", "postgres"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
mcp = ["mcp>=1.28,<2"]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.15.20",
  "hypothesis>=6.100",
  "pytest-benchmark>=5.1",
]

[project.scripts]
mneme = "mnemosyne.cli:main"
mneme-mcp = "mnemosyne.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
# repo root ("."), so the top-level `eval` package imports under any invocation
# (`pytest` as well as `python -m pytest`); `src` for the installed package.
pythonpath = ["src", "."]
