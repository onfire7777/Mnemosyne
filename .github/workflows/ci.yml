name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly soak window for the gated DST/chaos suite (Task 11). Runs off-hours;
  # never gates push/PR.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # actions/setup-python v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install pip==26.1.2 uv==0.11.16
      - name: Sync locked lint environment
        run: uv sync --locked --group dev
      - name: ruff check
        run: uv run --locked ruff check .

  test:
    name: Unit + drift checks
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      # actions/setup-python v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install pip==26.1.2 uv==0.11.16
      - name: Sync locked test environment
        run: |
          uv sync --locked --extra mcp --group dev
      - name: Run test suite (local backend; live-Postgres tests self-skip)
        run: uv run --locked python -m pytest
      - name: Drift checks only (explicit gate)
        run: uv run --locked python -m pytest tests/test_config_drift.py -q
      - name: G0 preregistration gate replay
        run: >-
          uv run --locked python -m pytest
          tests/test_g0_harness.py::test_committed_g0_preregistrations_have_passing_decisions
          tests/test_g0_harness.py::test_current_g0_candidate_replays_preregistrations_without_regression
          -q
      # Native parity leg: runs ONLY when the runner image already ships a Rust
      # toolchain (ubuntu-latest does today). If cargo is absent we skip rather
      # than install one — the default lane stays rust-free by design (the pure
      # path is canonical and must keep passing with no toolchain). This step
      # runs LAST in the job so the `--extra native` sync cannot leak a native
      # environment into the rust-free steps above.
      - name: Native parity (both modes; skips if runner has no Rust)
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            echo "Rust toolchain not present on runner; skipping native parity leg (default lane is rust-free by design)"
            exit 0
          fi
          uv sync --locked --extra mcp --extra native --group dev
          uv run --locked python -m pytest tests/test_native_parity.py tests/test_native_dispatch.py -q
          MNEMOSYNE_PURE=1 uv run --locked python -m pytest tests/test_native_parity.py tests/test_native_dispatch.py -q

  windows-file-lock:
    name: Windows file lock
    runs-on: windows-latest
    steps:
      # actions/checkout v7
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # actions/setup-python v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install pip==26.1.2 uv==0.11.16
      - name: Sync locked test environment
        run: uv sync --locked --group dev
      - name: Run cross-process lock coverage
        run: >-
          uv run --locked python -m pytest tests/test_file_lock.py
          tests/test_leaderboard_ledger.py -q

  windows-portability:
    name: Windows portability
    runs-on: windows-latest
    steps:
      # actions/checkout v7
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # actions/setup-python v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install pip==26.1.2 uv==0.11.16
      - name: Sync locked Windows test environment
        run: uv sync --locked --extra mcp --group dev
      - name: Run Windows portability tests
        run: >-
          uv run --locked python -m pytest
          tests/test_command_line.py
          tests/test_cli_runtime_tools.py::test_production_evidence_manifest_path_rewrite_preserves_windows_backslashes
          tests/completion/provenance/test_c2pa_infra_trust_policy.py::test_c2pa_existing_tool_path_with_spaces_is_literal_argv
          tests/completion/provenance/test_c2pa_infra_trust_policy.py::test_c2pa_direct_windows_batch_tool_fails_closed
          tests/completion/provenance/test_c2pa_infra_trust_policy.py::test_c2pa_empty_tool_command_fails_closed
          -q

  provider-conformance:
    name: Provider conformance
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # actions/setup-python v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install pip==26.1.2 uv==0.11.16
      - name: Sync locked provider test environment
        run: uv sync --locked --group dev
      - name: Python provider contract
        run: uv run --locked python -m pytest tests/test_provider_contract.py tests/test_provider_batching.py -q
      - name: Embedding service self-test
        run: EMBEDDING_SERVICE_FORCE_FALLBACK=1 uv run --locked python services/embedding/selftest.py
      - name: Rust provider sidecar contract
        run: cargo test --manifest-path rust/mneme-providers/Cargo.toml

  postgres:
    name: Postgres integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:9073dff8ba54ee8cefcfec5bc2a1269fc9f3aeecbd431eb892549d9b83dc1325
        env:
          POSTGRES_DB: mnemosyne
          POSTGRES_USER: mnemosyne
          POSTGRES_PASSWORD: mnemosyne-local-dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mnemosyne -d mnemosyne"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MNEMOSYNE_POSTGRES_DSN: postgresql://mnemosyne:mnemosyne-local-dev@localhost:5432/mnemosyne
    steps:
      # actions/checkout v7
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # actions/setup-python v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install pip==26.1.2 uv==0.11.16
      - name: Sync locked Postgres test environment
        run: |
          uv sync --locked --extra mcp --extra postgres --group dev
      - name: Load canonical schema
        run: psql "$MNEMOSYNE_POSTGRES_DSN" -f sql/schema.sql
      - name: Run Postgres-backed live tests
        run: uv run --locked python -m pytest tests/test_postgres_engine_live.py -q

  native-wheels:
    name: Native wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # GATING: native wheels are part of the performance parity delivery path.
    # Pure Python remains the canonical fallback, but packaging regressions must
    # block merges once the wheel path is advertised.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]  # macos-14 = arm64; ubuntu-latest = x86_64
    steps:
      # actions/checkout v7
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # actions/setup-python v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      # PyO3/maturin-action v1 (v1.51.0) — abi3-py312 comes from the crate's
      # pyo3 feature flags, so one wheel per platform covers CPython >=3.12.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          working-directory: rust/mnemosyne-native
          args: --release --out dist
      - name: Install built wheel and smoke import
        shell: bash
        run: |
          python -m pip install --no-deps --force-reinstall rust/mnemosyne-native/dist/*.whl
          python - <<'PY'
          import mnemosyne_native as native

          assert native.__version__
          assert native.parity_marker() == "strict-ieee-scalar-v1"
          print(f"mnemosyne_native {native.__version__} {native.parity_marker()}")
          PY
      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mnemosyne-native-wheels-${{ matrix.os }}
          path: rust/mnemosyne-native/dist/*.whl
          if-no-files-found: error

  chaos:
    name: DST / chaos soak (nightly, non-gating)
    runs-on: ubuntu-latest
    # Nightly / manual only — the gated chaos dir is deselected in a plain run
    # (MNEMOSYNE_CHAOS unset), so this job is the ONLY place it executes.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    # NON-GATING until the suite has soaked: seeded DST fault injection is a
    # durability/parity backstop, not a merge gate. A red night must surface a
    # ratchet-able seed, not block anything. Flip off once it has proven stable.
    continue-on-error: true
    env:
      MNEMOSYNE_CHAOS: "1"
    steps:
      # actions/checkout v7
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # actions/setup-python v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install pip==26.1.2 uv==0.11.16
      - name: Sync locked chaos test environment
        run: |
          uv sync --locked --extra mcp --group dev
      - name: Run seeded DST / chaos suite (differential oracle + lane invariants)
        run: uv run --locked python -m pytest tests/chaos -q
