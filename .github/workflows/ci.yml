name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # actions/setup-python v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install pip==26.1.2 uv==0.11.16
      - name: Sync locked lint environment
        run: uv sync --frozen --group dev
      - name: ruff check
        run: uv run ruff check .

  test:
    name: Unit + drift checks
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # actions/setup-python v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install pip==26.1.2 uv==0.11.16
      - name: Sync locked test environment
        run: |
          uv sync --frozen --extra mcp --group dev
      - name: Run test suite (local backend; live-Postgres tests self-skip)
        run: uv run python -m pytest
      - name: Drift checks only (explicit gate)
        run: uv run python -m pytest tests/test_config_drift.py -q
      - name: G0 preregistration gate replay
        run: >-
          uv run python -m pytest
          tests/test_g0_harness.py::test_committed_g0_preregistrations_have_passing_decisions
          tests/test_g0_harness.py::test_current_g0_candidate_replays_preregistrations_without_regression
          -q

  postgres:
    name: Postgres integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:9073dff8ba54ee8cefcfec5bc2a1269fc9f3aeecbd431eb892549d9b83dc1325
        env:
          POSTGRES_DB: mnemosyne
          POSTGRES_USER: mnemosyne
          POSTGRES_PASSWORD: mnemosyne-local-dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mnemosyne -d mnemosyne"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MNEMOSYNE_POSTGRES_DSN: postgresql://mnemosyne:mnemosyne-local-dev@localhost:5432/mnemosyne
    steps:
      # actions/checkout v7
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # actions/setup-python v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install pip==26.1.2 uv==0.11.16
      - name: Sync locked Postgres test environment
        run: |
          uv sync --frozen --extra mcp --extra postgres --group dev
      - name: Load canonical schema
        run: psql "$MNEMOSYNE_POSTGRES_DSN" -f sql/schema.sql
      - name: Run Postgres-backed live tests
        run: uv run python -m pytest tests/test_postgres_engine_live.py -q
