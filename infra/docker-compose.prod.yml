# Mnemosyne — hardened SELF-HOSTED production stack (no-GPU).
# Extends infra/docker-compose.providers.yml (Keycloak/Vault/c2pa) into a complete,
# segmented, fail-closed production profile. Caddy is the SOLE published port.
#
# FIRST-RUN: run infra/prod/bootstrap.sh first (step-ca, Vault transit, Keycloak realm,
# Postgres roles, model pull). Then `docker compose -f infra/docker-compose.prod.yml up -d`.
# CI MUST digest-pin every registry image and run the policy-as-code gate
# (no docker.sock, non-root, read_only, cap_drop ALL, limits). Operators MUST
# retain infra/scripts/verify-supply-chain.sh output before Tier-B capture.

x-hardened: &hardened
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  restart: unless-stopped
  init: true
  pids_limit: 512
  # NOTE: docker.sock is NEVER mounted into any service.

networks:
  edge:      { driver: bridge }                 # caddy <-> public-facing service routes
  internal:  { internal: true }                 # service-to-service, no NAT/egress
  datasec:   { internal: true }                 # postgres + vault; reachable only by the consolidator
  hostllm:   { internal: true }                 # host-llm-proxy (DEFAULT LLM path) <-> sanctioned clients (consolidator/role-http/operator/test-runner)
  hostbridge: { driver: bridge }                # host-llm-proxy's SOLE host-gateway egress net (relay-only; keeps the unauth VM->host bridge off edge/api)

volumes:
  stepca: {}
  pgdata: {}     # put on a LUKS/FileVault-encrypted host path in production
  vault: {}
  kc: {}
  seaweed: {}
  vmdata: {}
  grafana: {}
  caddy_data: {}
  ollama: {}
  mnemo_api_data: {}
  mnemo_consolidator_data: {}
  ops_dashboard: {}

services:
  caddy:                                   # SOLE ingress: terminates TLS (step-ca ACME), the only published port
    <<: *hardened
    image: caddy:2.8@sha256:226d1f059b75399fe19182893c7184591c07b97afc8dfcf44eeb80c9a77a530f
    cap_add: ["NET_BIND_SERVICE"]
    depends_on: [step-ca, mnemo-api, mnemo-stream, keycloak, grafana, embedder, seaweedfs, role-http]
    ports: ["443:443"]                     # bind to a concrete LAN/VPN iface in prod, never 0.0.0.0/WAN
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      # Caddy's ACME issuer + mTLS trust_pool must chain to step-ca's REAL live
      # root only. The general step-ca-root.crt is a two-root bundle (Vault's
      # cert is from an orphaned older CA generation); Go x509 rejects the
      # duplicate-Subject bundle during ACME (ECDSA verify failure), so Caddy
      # gets a dedicated single-root file = step-ca's current root_ca.crt.
      - ${MNEMO_SECRETS_DIR:-/secure/outside/repo}/stepca-acme-root.crt:/data/step-ca-root.crt:ro
      - ops_dashboard:/pub:ro
    tmpfs: ["/config:size=16m"]
    networks:                              # internal = proxy backhaul to tei/s3/grafana; aliases give
      edge:                                # every service one HTTPS name that resolves to the ingress
        aliases: [mcp.mnemo.local, kc.mnemo.local, tei.mnemo.local, s3.mnemo.local, grafana.mnemo.local, ops.mnemo.local, roles.mnemo.local]
      internal:
        aliases: [mcp.mnemo.local, kc.mnemo.local, tei.mnemo.local, s3.mnemo.local, grafana.mnemo.local, ops.mnemo.local, roles.mnemo.local]

  step-ca:                                 # internal ACME CA -> real, non-self-signed chains (TLS gate)
    <<: *hardened
    image: smallstep/step-ca:0.28.4@sha256:0f88382ac5af5c6b7bbba0c6e8fcefef52aee6f22ea364df8e02a09ffd0d22f3
    # The step-ca binary ships file capabilities (setcap NET_BIND_SERVICE), which
    # no-new-privileges blocks at exec for a non-root user. Exception: permit that
    # single bounded gain (cap_add) and drop only the no-new-privileges bit here.
    security_opt: []
    cap_add: ["NET_BIND_SERVICE"]
    environment: { DOCKER_STEPCA_INIT_NAME: Mnemosyne, DOCKER_STEPCA_INIT_DNS_NAMES: ca.mnemo.local }
    volumes: [stepca:/home/step]
    networks:
      edge: { aliases: [ca.mnemo.local] }
      internal: { aliases: [ca.mnemo.local] }

  postgres:                                # NATIVE retrieval engine: FTS + pgvector HNSW + recursive-PPR
    <<: *hardened
    image: pgvector/pgvector:pg16@sha256:ad2e18408bf447f62092a8a5259e7df10505c5a0360bd1a1853ac8b8b0763da2
    user: "999:999"
    environment:
      POSTGRES_DB: mnemosyne
      POSTGRES_USER: mnemosyne_superuser   # bootstrap only; apps use least-privilege roles (roles.sql)
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_pw
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../sql/schema.sql:/docker-entrypoint-initdb.d/05-schema.sql:ro
      - ./postgres/roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
      - ./postgres/20-keycloak-db.sh:/docker-entrypoint-initdb.d/20-keycloak-db.sh:ro
    secrets: [pg_superuser_pw, kc_db_pw, app_db_pw, consolidator_db_pw, eval_db_pw]
    tmpfs: ["/tmp:size=64m", "/run/postgresql:size=64m"]
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "maintenance_work_mem=512MB"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U mnemosyne_superuser -d mnemosyne"], interval: 10s, retries: 6 }
    # P1 capacity rebalance (infra/PERF-RUNTIME.md): explicit ceilings so no single
    # service can monopolize the VM; applied only via scripts/apply-perf-runtime.sh.
    mem_limit: 2g
    cpus: 2.0
    networks:                              # internal = RLS-scoped least-privilege reads for the API;
      internal: { aliases: [postgres.mnemo.local] }   # datasec = write/KMS side (consolidator, keycloak, vault)
      datasec: { aliases: [postgres.mnemo.local] }

  embedder:                                # real embeddings (1024-dim) + real cross-encoder reranker
    # The repo's own SLO-proven provider service (services/embedding/) — implements the
    # exact HttpEmbeddingProvider/HttpReranker contract, arch-native (TEI ships amd64-only).
    # Models are baked into the image at build time: the internal network has no egress.
    <<: *hardened
    build: { context: ../services/embedding, dockerfile: Dockerfile }
    environment: { HF_HUB_OFFLINE: "1", EMBEDDING_SERVICE_DIMS: "1024" }
    tmpfs: ["/tmp:size=128m"]
    mem_limit: 4g
    cpus: 2.0
    networks: [internal]

  keycloak:                                # OIDC/JWKS (FR-7/9) — production realm imported by bootstrap
    <<: *hardened
    build: { context: ./keycloak, dockerfile: Dockerfile }   # optimized image: kc.sh build baked in
    user: "1000:0"
    command: ["start", "--optimized", "--hostname=kc.mnemo.local", "--proxy-headers=xforwarded", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres.mnemo.local:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?export from $MNEMO_SECRETS_DIR/kc_db_pw before compose up}
      # Keycloak 25 reads KEYCLOAK_ADMIN*; the KC_BOOTSTRAP_ADMIN_* names are the
      # Keycloak 26 replacements and are silently ignored by 25.x — without the
      # legacy pair no master admin is ever (re)created and operator recovery
      # requires a schema reset. Keep both until the image moves to >=26.
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?export from $MNEMO_SECRETS_DIR/kc_admin_pw before compose up}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?export from $MNEMO_SECRETS_DIR/kc_admin_pw before compose up}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"               # TLS terminated at Caddy; KC reachable only on internal net
    volumes:
      - kc:/opt/keycloak/data
      - ./keycloak/realm-mnemosyne.json:/opt/keycloak/data/import/realm-mnemosyne.json:ro
    tmpfs: ["/tmp:size=64m"]
    mem_limit: 1g
    networks: [edge, datasec]

  vault:                                   # KMS transit (crypto-shred) — PRODUCTION: sealed, no dev root token
    <<: *hardened
    image: hashicorp/vault:1.17@sha256:74a4ab138ab5d64725e89cd9a9c73f7040c7fe49e98b71697b275ca9a69919df
    # Non-root from the start: the image entrypoint then skips its root-only setcap
    # (blocked by cap_drop ALL). mlock is disabled in vault.hcl for the container
    # profile — put the vault volume on encrypted host storage instead.
    user: "100:100"
    environment: { SKIP_SETCAP: "true" }   # setcap is root-only and blocked by cap_drop ALL
    command: ["vault", "server", "-config=/vault/config/vault.hcl"]
    volumes:
      - vault:/vault/file
      - ./vault/vault.hcl:/vault/config/vault.hcl:ro
      - ${MNEMO_SECRETS_DIR:-/secure/outside/repo}/vault-tls:/vault/tls:ro   # step-ca-issued leaf (bootstrap.sh)
    tmpfs: ["/tmp:size=16m"]
    networks:
      datasec: { aliases: [vault.mnemo.local] }
    # bootstrap.sh runs `vault operator init` + transit enable + AppRole; NEVER a committed root token.

  seaweedfs:                               # S3 object store (native AES256) for multimodal (B6)
    <<: *hardened
    image: chrislusf/seaweedfs:3.79@sha256:21425305e04b355904ef350ff75a4e81b8afc5124f63e0485b946164b58562d3
    command: ["server", "-s3", "-dir=/data", "-s3.config=/etc/seaweed/s3.json"]
    volumes:
      - seaweed:/data
      # s3.json carries access/secret keys -> generated by bootstrap.sh OUTSIDE the repo
      - ${MNEMO_SECRETS_DIR:-/secure/outside/repo}/seaweed-s3.json:/etc/seaweed/s3.json:ro
    # the filer creates /tmp/seaweedfs-filer-*.sock; without a tmpfs the
    # read_only rootfs made it crash-loop (F filer.go: read-only file system)
    tmpfs: ["/tmp:size=64m"]
    networks: [internal]

  victoriametrics:
    <<: *hardened
    image: victoriametrics/victoria-metrics:v1.102.1@sha256:8d34a7572df2ef57ef3e55257c112b1ba1c3ca0fecb138fea5cfed882c0cdb07
    command:
      - "--storageDataPath=/vmdata"
      - "--retentionPeriod=90d"
      # Scrapes the blackbox TLS probes (B2 lifecycle alerts) and vmalert's
      # own /metrics so tripwire/alert state is queryable from Grafana.
      - "--promscrape.config=/etc/victoria/scrape.yml"
    volumes:
      - vmdata:/vmdata
      - ./observability/victoriametrics/scrape.yml:/etc/victoria/scrape.yml:ro
    networks: [internal]

  mnemo-metrics:                           # read-only ops-report -> VictoriaMetrics push (tripwire series source)
    <<: *hardened
    build: { context: .., dockerfile: infra/Dockerfile, target: runtime }
    env_file: [./profiles/self-hosted.env]
    environment:
      MNEMOSYNE_ROLE: metrics-pusher
      MNEMOSYNE_QUEUE_TENANT: primary   # snapshot the production tenant queue, not the 'system' default
      PGPASSFILE: /run/secrets/pgpass_app     # read-path app_user; no write or KMS authority
      SSL_CERT_FILE: /run/secrets/step_ca_root
      MNEMOSYNE_OPS_METRICS_URL: http://victoriametrics:8428/api/v1/import/prometheus
      MNEMOSYNE_OPS_METRICS_ALLOWED_INTERNAL_HOSTS: victoriametrics
      MNEMOSYNE_OPS_METRICS_INTERVAL: "60"
      MNEMOSYNE_OPS_DASHBOARD_HTML_OUT: /pub/ops-dashboard.html
    command: ["--tenant", "primary"]
    secrets: [pgpass_app, step_ca_root]
    volumes: [ops_dashboard:/pub]
    tmpfs: ["/tmp:size=32m"]
    networks: [internal]
    depends_on: [postgres, victoriametrics]

  blackbox-exporter:                       # TLS chain/hostname/expiry probe source (B2 tls-lifecycle row)
    <<: *hardened
    image: prom/blackbox-exporter:v0.25.0@sha256:b04a9fef4fa086a02fc7fcd8dcdbc4b7b35cc30cdee860fdc6a19dd8b208d63e
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    depends_on: [caddy]
    volumes:
      - ./observability/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
      - ${MNEMO_SECRETS_DIR:-/secure/outside/repo}/step-ca-root.crt:/etc/blackbox/step-ca-root.crt:ro
      # step-ca client leaf (bundle) + key: the https_stepca probe presents this
      # for the mTLS-enforced mcp.mnemo.local ingress (B3); harmless on the other
      # hosts, which never send a CertificateRequest.
      - ${MNEMO_SECRETS_DIR:-/secure/outside/repo}/mcp-client.crt:/etc/blackbox/mcp-client.crt:ro
      - ${MNEMO_SECRETS_DIR:-/secure/outside/repo}/mcp-client.key:/etc/blackbox/mcp-client.key:ro
    networks: [internal]

  vmalert:
    <<: *hardened
    image: victoriametrics/vmalert:v1.102.1@sha256:53c9a4a0a136c73b0a8ab74db42c1a2c0c4b511ec037761a42a6029996652e9e
    command:
      - "-datasource.url=http://victoriametrics:8428"
      - "-remoteRead.url=http://victoriametrics:8428"
      - "-remoteWrite.url=http://victoriametrics:8428"
      - "-rule=/etc/vmalert/rules/*.yml"
      # Self-hosted delivering alert route (B8): firing alerts are POSTed to the
      # in-cluster alert-sink (Alertmanager v2 /api/v2/alerts). A subscriber
      # verifies real end-to-end delivery — no external Alertmanager needed.
      - "-notifier.url=http://alert-sink:9099"
    volumes:
      - ./observability/vmalert:/etc/vmalert/rules:ro
    tmpfs: ["/tmp:size=16m"]
    networks: [internal]
    depends_on: [victoriametrics, alert-sink]

  alert-sink:                              # B8 core: self-hosted alert delivery target + subscriber surface
    <<: *hardened
    build: { context: .., dockerfile: infra/Dockerfile, target: runtime }
    entrypoint: ["python", "/opt/mnemosyne/bin/alert-sink"]
    environment:
      ALERT_SINK_HOST: 0.0.0.0
      ALERT_SINK_PORT: "9099"
    tmpfs: ["/tmp:size=8m"]
    networks: [internal]

  grafana:                                 # hosted dashboard URL for B8 (mode=hosted_url)
    <<: *hardened
    image: grafana/grafana:11.1.0@sha256:079600c9517b678c10cda6006b4487d3174512fd4c6cface37df7822756ed7a5
    user: "472:472"
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_pw
      GF_SERVER_ROOT_URL: https://grafana.mnemo.local
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    secrets: [grafana_admin_pw]
    volumes: [grafana:/var/lib/grafana]
    tmpfs: ["/tmp:size=32m"]
    networks: [edge, internal]

  mnemo-api:                               # EDGE: MCP/HTTP surface. Least-privilege DB role; Vault for key custody only.
    <<: *hardened
    build: { context: .., dockerfile: infra/Dockerfile, target: runtime }   # adjust to the app Dockerfile path
    env_file: [./profiles/self-hosted.env]
    environment:
      MNEMOSYNE_MCP_PRODUCTION_PROFILE: "1"
      MNEMOSYNE_MCP_REQUIRE_SESSION: "1"
      MNEMOSYNE_ROLE: api
      MNEMOSYNE_MCP_HTTP_HEALTH_PATH: /health  # match the profile's published URLs
      MNEMOSYNE_MCP_HTTP_RPC_PATH: /rpc
      MNEMOSYNE_MCP_SESSION_SECRET_COMMAND: /opt/mnemosyne/bin/vault-session-secret
      MNEMOSYNE_MCP_TOKEN_FILE: /run/secrets/mcp_bearer_token   # bearer defense-in-depth beside required signed sessions
      PGPASSFILE: /run/secrets/pgpass_app      # password for the least-privilege app_user DSN
      SSL_CERT_FILE: /run/secrets/step_ca_root # trust the internal CA for https://*.mnemo.local
      VAULT_ADDR: https://vault.mnemo.local:8200
      VAULT_CACERT: /run/secrets/step_ca_root
      VAULT_TOKEN_FILE: /run/secrets/vault_app_token
      MNEMOSYNE_VAULT_WRAP_DIR: /data/wrapped-keys
    secrets: [pgpass_app, step_ca_root, vault_app_token, mcp_bearer_token]
    volumes: [mnemo_api_data:/data]            # AES-GCM object store + wrapped-DEK sidecars
    tmpfs: ["/tmp:size=64m"]
    mem_limit: 1g
    cpus: 2.0
    # datasec: required for command-backed Vault key custody (session verify + object DEK wrap);
    # DB writes stay least-privilege via app_user (no DELETE/TRUNCATE, RLS forced).
    networks: [edge, internal, datasec]
    depends_on: [keycloak, embedder]


  mnemo-stream:                               # EDGE: MCP SDK StreamableHTTP transport (B3 streamable_http evidence).
    <<: *hardened
    build: { context: .., dockerfile: infra/Dockerfile, target: runtime }   # adjust to the app Dockerfile path
    env_file: [./profiles/self-hosted.env]
    environment:
      MNEMOSYNE_MCP_PRODUCTION_PROFILE: "1"
      MNEMOSYNE_MCP_REQUIRE_SESSION: "1"
      MNEMOSYNE_ROLE: mcp-stream
      MNEMOSYNE_MCP_HTTP_PORT: "8081"
      MNEMOSYNE_MCP_HTTP_RPC_PATH: /rpc
      MNEMOSYNE_MCP_SESSION_SECRET_COMMAND: /opt/mnemosyne/bin/vault-session-secret
      MNEMOSYNE_MCP_TOKEN_FILE: /run/secrets/mcp_bearer_token   # bearer defense-in-depth beside required signed sessions
      PGPASSFILE: /run/secrets/pgpass_app      # password for the least-privilege app_user DSN
      SSL_CERT_FILE: /run/secrets/step_ca_root # trust the internal CA for https://*.mnemo.local
      VAULT_ADDR: https://vault.mnemo.local:8200
      VAULT_CACERT: /run/secrets/step_ca_root
      VAULT_TOKEN_FILE: /run/secrets/vault_app_token
      MNEMOSYNE_VAULT_WRAP_DIR: /data/wrapped-keys
    secrets: [pgpass_app, step_ca_root, vault_app_token, mcp_bearer_token]
    tmpfs: ["/data:size=32m", "/tmp:size=64m"]   # ephemeral: object store + wrapped-DEK sidecars
    # datasec: required for command-backed Vault key custody (session verify + object DEK wrap);
    # DB writes stay least-privilege via app_user (no DELETE/TRUNCATE, RLS forced).
    networks: [edge, internal, datasec]
    depends_on: [keycloak, embedder]

  mnemo-consolidator:                      # BACK: sole write + KMS authority. NO edge reachability.
    <<: *hardened
    build: { context: .., dockerfile: infra/Dockerfile, target: runtime }
    env_file: [./profiles/self-hosted.env]
    environment:
      MNEMOSYNE_ROLE: consolidator
      # production jobs are enqueued under the primary tenant; without this the
      # worker drains the default 'system' tenant and never processes them
      MNEMOSYNE_QUEUE_TENANT: primary
      # Role-LLM sizing: with the host-llm relay as the DEFAULT path (PERF-RUNTIME.md),
      # qwen3:4b serves from host Metal at ~24 tok/s (measured 2026-07-05) —
      # the architecture doc's intended model. In-VM CPU serving of 4b measured
      # ~0.5 tok/s; if falling back to in-VM ollama ('in-vm-llm' profile), drop to
      # qwen3:0.6b again. Timeout bounds keep the conservative envelope.
      OLLAMA_MODEL: qwen3:4b
      OLLAMA_TIMEOUT: "280"
      MNEMOSYNE_ROLE_LADDER_TIMEOUT: "300"
      MNEMOSYNE_ROLE_LADDER_LOCAL_TIMEOUT: "280"   # local rung defaults to min(20s, total) — far below measured latency
      # §31 cadence steps are counted per worker-run PROCESS invocation; with the
      # default max_cycles=1 the process exits after each job, the counter resets,
      # and the 5-step consolidation cadence bound can never be satisfied. Keep the
      # worker long-lived; the entrypoint supervise loop remains for crash recovery.
      MNEMOSYNE_WORKER_MAX_CYCLES: "1000"
      MNEMOSYNE_WORKER_IDLE_EXIT_AFTER: "600"
      # Runtime command-provider subprocess timeouts (default 30s) must cover the
      # ladder's measured role-call latency on this host.
      MNEMOSYNE_CANDIDATE_EXTRACTOR_TIMEOUT: "320"
      MNEMOSYNE_SUMMARIZER_TIMEOUT: "320"
      MNEMOSYNE_ENTITY_RESOLVER_TIMEOUT: "320"
      MNEMOSYNE_LESSON_DISTILLER_TIMEOUT: "320"
      MNEMOSYNE_SKILL_INDUCER_TIMEOUT: "320"
      # B6 multimodal: the supervised worker handles media_extract jobs with a
      # real embedded-text extractor + bge-backed media embedder (object store
      # backend stays local by default; the S3 backend is opt-in per tenant).
      MNEMOSYNE_MEDIA_EXTRACTOR_COMMAND: /opt/mnemosyne/bin/media-text-extractor
      MNEMOSYNE_MEDIA_EMBEDDING_PROVIDER: command
      MNEMOSYNE_MEDIA_EMBEDDING_COMMAND: /opt/mnemosyne/bin/media-embedding
      # sole write authority: overrides the env_file's read-path app_user DSN
      MNEMOSYNE_POSTGRES_DSN: postgresql://consolidator_user@postgres.mnemo.local:5432/mnemosyne
      PGPASSFILE: /run/secrets/pgpass_consolidator
      SSL_CERT_FILE: /run/secrets/step_ca_root
      VAULT_ADDR: https://vault.mnemo.local:8200
      VAULT_CACERT: /run/secrets/step_ca_root
      VAULT_TOKEN_FILE: /run/secrets/vault_app_token
      MNEMOSYNE_VAULT_WRAP_DIR: /data/wrapped-keys
      # DEFAULT LLM path: host-Metal ollama via the host-llm-proxy relay
      # (~24 tok/s vs ~0.5 in-VM; infra/PERF-RUNTIME.md). In-VM fallback = the
      # 'in-vm-llm' profile (then OLLAMA_URL: http://ollama.mnemo.local:11434).
      OLLAMA_URL: http://host-llm.mnemo.local:11434
    secrets: [pgpass_consolidator, step_ca_root, vault_app_token]
    volumes: [mnemo_consolidator_data:/data]
    tmpfs: ["/tmp:size=64m"]
    mem_limit: 1g
    cpus: 2.0
    networks: [internal, datasec, hostllm]   # hostllm: sanctioned client of the default host-llm relay
    # host-Metal (relay) is the default LLM path; in-VM ollama is opt-in ('in-vm-llm' profile).
    depends_on: [postgres, vault]

  ollama:                                  # FALLBACK role-LLM (opt-in 'in-vm-llm' profile): in-VM CPU serving, OFF by default
    # Host-Metal via host-llm-proxy is the committed default LLM path
    # (infra/PERF-RUNTIME.md); in-VM 4b serving measured ~0.5 tok/s. Restore the
    # in-VM fallback with `COMPOSE_PROFILES=in-vm-llm docker compose up -d ollama`,
    # then point the LLM clients back at http://ollama.mnemo.local:11434.
    <<: *hardened
    profiles: ["in-vm-llm"]
    image: ollama/ollama:0.13.1@sha256:8850b8b33936b9fb246e7b3e02849941f1151ea847e5fb15511f17de9589aea1
    environment:
      OLLAMA_KEEP_ALIVE: 24h   # role calls must not pay a cold model reload (default 5m eviction)
    volumes: [ollama:/root/.ollama]
    tmpfs: ["/tmp:size=64m"]
    mem_limit: 6g   # qwen3:4b needs ~3.3GiB resident + page cache headroom for the blob
    cpus: 3.0       # heaviest CPU burner in the VM; must not starve postgres/api under inference
    networks:                              # edge grants egress for `ollama pull`; serving happens on internal
      edge: {}
      internal: { aliases: [ollama.mnemo.local] }

  host-llm-proxy:                          # DEFAULT LLM path: relay to host-Metal ollama (starts on a plain `up -d`)
    # Host Metal serves qwen3:4b at ~24-27 tok/s vs ~0.5 tok/s in-VM (measured;
    # infra/PERF-RUNTIME.md), so this relay is the committed default serving path
    # — no overlay, no manual flip. The LLM clients (consolidator/role-http/
    # test-runner) sit on internal-only networks which have NO route to the host
    # gateway (probe-verified: 'Network is unreachable'), so this relay is the
    # sole sanctioned egress path. It sits on hostbridge (its OWN dedicated
    # non-internal net, for the host-gateway route) + hostllm (the client net) —
    # deliberately NOT on edge or the general internal net. The host bridge it
    # exposes is unauthenticated, so keeping it off edge means caddy/api/stream
    # cannot reach it; only the dedicated hostllm client net (consolidator/
    # role-http/operator/test-runner) can (policy gate: test_prod_compose_policy).
    # In-VM ollama fallback is opt-in via the 'in-vm-llm' profile.
    <<: *hardened
    image: caddy:2.8@sha256:226d1f059b75399fe19182893c7184591c07b97afc8dfcf44eeb80c9a77a530f
    # The caddy binary ships file-capability cap_net_bind_service; under the
    # hardened anchor (cap_drop ALL + no-new-privileges) execve of a fcap binary
    # needs that cap in the bounding set or tini fails with EPERM. The main caddy
    # ingress grants it for the same reason; the relay only listens on :11434 so
    # it is functionally unused, but required to exec.
    cap_add: ["NET_BIND_SERVICE"]
    command: ["caddy", "reverse-proxy", "--from", "http://:11434", "--to", "http://host.docker.internal:11434"]
    # colima's dockerd resolves host.docker.internal natively (verified 192.168.65.254);
    # the explicit host-gateway mapping keeps the relay portable to other engines.
    extra_hosts: ["host.docker.internal:host-gateway"]
    # Health = full serve path: the relay's :11434 listener proxied through to the
    # host ollama /api/version (BusyBox wget ships in the alpine-based caddy image;
    # a non-2xx — e.g. host ollama down — exits non-zero and marks the relay
    # unhealthy). Nothing depends_on this healthcheck; it makes serve state visible.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:11434/api/version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    tmpfs: ["/config:size=16m", "/data:size=16m", "/tmp:size=8m"]
    mem_limit: 256m
    networks:
      hostbridge: {}                       # relay-ONLY non-internal net: routes to the host gateway (host.docker.internal). NOT edge — keeps the unauth VM->host bridge unreachable from caddy/api/stream.
      hostllm: { aliases: [host-llm.mnemo.local] }   # dedicated client net — NOT the general internal/edge net

  role-http:                               # B4/B9: hosted HTTPS role provider (wraps role-llm dispatch)
    <<: *hardened
    build: { context: .., dockerfile: infra/Dockerfile, target: runtime }
    entrypoint: ["python", "/opt/mnemosyne/bin/role-http"]
    env_file: [./profiles/self-hosted.env]
    environment:
      ROLE_HTTP_HOST: 0.0.0.0
      ROLE_HTTP_PORT: "8791"
      # DEFAULT LLM path: host-Metal ollama via the host-llm-proxy relay, where
      # the architecture doc's qwen3:4b is viable (~24 tok/s; infra/PERF-RUNTIME.md).
      # In-VM fallback = 'in-vm-llm' profile (OLLAMA_URL: http://ollama.mnemo.local:11434,
      # and drop to qwen3:0.6b since in-VM 4b is unusable under full-stack contention).
      OLLAMA_URL: http://host-llm.mnemo.local:11434
      OLLAMA_MODEL: qwen3:4b
      OLLAMA_TIMEOUT: "280"
    tmpfs: ["/tmp:size=32m"]
    networks: [internal, hostllm]           # Caddy backhaul on internal; hostllm: sanctioned client of the default relay
    # host-Metal (relay) is the default LLM path; in-VM ollama is opt-in ('in-vm-llm' profile).

  parametric-http:                         # B9: hosted HTTPS parametric-tier adapter serving
    <<: *hardened
    # Same runtime image as role-http, expressed as a build (layer-cache no-op)
    # because `image: infra-role-http` violated the digest-pin policy gate and
    # silently depended on the compose project being named `infra`. The repo is
    # mounted read-only so mnemosyne.parametric_adapter + parametric-http.py are
    # on the path.
    build: { context: .., dockerfile: infra/Dockerfile, target: runtime }
    entrypoint: ["python", "/opt/mnemosyne/repo/infra/providers/parametric-http.py"]
    environment:
      PYTHONPATH: /opt/mnemosyne/repo/src
      PARAMETRIC_HTTP_HOST: 0.0.0.0
      PARAMETRIC_HTTP_PORT: "8793"
      SSL_CERT_FILE: /run/secrets/step_ca_root       # trust the step-ca S3 ingress
      # The adapter artifact is loaded from SeaweedFS by content hash at startup.
      MNEMOSYNE_S3_ENDPOINT: https://s3.mnemo.local
      MNEMOSYNE_S3_BUCKET: mnemosyne-parametric
      MNEMOSYNE_S3_CREDENTIALS_FILE: /run/secrets/seaweed_s3
      PARAMETRIC_S3_KEY: parametric/primary/b4ca456e55d30604455858bc711120122aecbdc2df48e3b85860034d42bcb40a.json
      PARAMETRIC_ARTIFACT_SHA256: b4ca456e55d30604455858bc711120122aecbdc2df48e3b85860034d42bcb40a
    secrets: [step_ca_root, seaweed_s3]
    volumes:
      - ../:/opt/mnemosyne/repo:ro
    tmpfs: ["/tmp:size=8m"]
    networks: [internal]                    # Caddy backhaul reaches it; it reaches s3.mnemo.local on the internal net
    depends_on: [seaweedfs]

  operator:                                # bastion for Tier-B capture runs (not started by default)
    <<: *hardened
    profiles: ["operator"]
    build: { context: .., dockerfile: infra/Dockerfile, target: runtime }
    entrypoint: ["sleep", "infinity"]
    environment:
      SSL_CERT_FILE: /run/secrets/step_ca_root
      VAULT_ADDR: https://vault.mnemo.local:8200
      VAULT_CACERT: /run/secrets/step_ca_root
      VAULT_TOKEN_FILE: /run/secrets/vault_app_token
      PGPASSFILE: /run/secrets/pgpass_consolidator
      # DEFAULT LLM path: host-Metal ollama via the host-llm-proxy relay.
      # In-VM fallback = 'in-vm-llm' profile (OLLAMA_URL: http://ollama.mnemo.local:11434).
      OLLAMA_URL: http://host-llm.mnemo.local:11434
      # B6 multimodal: the capture bastion runs provider-check, whose media
      # subchecks exercise the real extractor + bge-backed embedder command
      # providers baked into the image. Mirror the consolidator's media wiring
      # so provider-check's media_extractor/media_embedding subchecks are GREEN
      # here too (previously empty on the bastion -> media subcheck failed).
      MNEMOSYNE_MEDIA_EXTRACTOR_COMMAND: /opt/mnemosyne/bin/media-text-extractor
      MNEMOSYNE_MEDIA_EMBEDDING_PROVIDER: command
      MNEMOSYNE_MEDIA_EMBEDDING_COMMAND: /opt/mnemosyne/bin/media-embedding
      # provider-check exercises the command role providers (candidate_extractor/
      # summarizer/entity_resolver/lesson_distiller/skill_inducer -> role-llm ->
      # ollama). role-llm defaults to qwen3:4b @ 25s, unusable on this no-GPU
      # host; pin the same latency-tuned model + timeouts the consolidator uses
      # so the role subchecks return valid structure instead of timing out.
      OLLAMA_MODEL: qwen3:4b
      OLLAMA_TIMEOUT: "280"
      MNEMOSYNE_CANDIDATE_EXTRACTOR_TIMEOUT: "320"
      MNEMOSYNE_SUMMARIZER_TIMEOUT: "320"
      MNEMOSYNE_ENTITY_RESOLVER_TIMEOUT: "320"
      MNEMOSYNE_LESSON_DISTILLER_TIMEOUT: "320"
      MNEMOSYNE_SKILL_INDUCER_TIMEOUT: "320"
      # object-key provider-check probe writes a wrapped-key envelope; give it a
      # writable dir on the bastion tmpfs (no /data volume here).
      MNEMOSYNE_VAULT_WRAP_DIR: /tmp/mnemo-wrapped-keys
    secrets: [step_ca_root, vault_app_token, pgpass_consolidator, pgpass_app, mcp_bearer_token, mcp_client_cert, mcp_client_key]
    volumes:
      # identical absolute paths inside and out so evidence manifests stay portable
      - ../:/Users/admin/Mnemosyne
      - ${MNEMO_CUSTODY_DIR:-/secure/outside/repo-custody}:${MNEMO_CUSTODY_DIR:-/secure/outside/repo-custody}
      - ${MNEMO_EVIDENCE_OUT:-/secure/outside/repo-evidence}:${MNEMO_EVIDENCE_OUT:-/secure/outside/repo-evidence}
      # provider-check's oidc subcheck validates the deployed OIDC authorization
      # policy the runtime env references by its external absolute path; mount it
      # read-only at the identical path so the capture bastion can resolve it.
      - ${MNEMO_SECRETS_DIR:-/secure/outside/repo}/authz-policy.json:${MNEMO_SECRETS_DIR:-/secure/outside/repo}/authz-policy.json:ro
    tmpfs: ["/tmp:size=256m"]
    networks: [edge, internal, datasec, hostllm]   # hostllm: sanctioned client of the opt-in host-llm relay

  test-runner:                             # row-10 live-parity suite runner (profile-gated; never on by default)
    <<: *hardened
    profiles: ["test"]
    build: { context: .., dockerfile: infra/Dockerfile, target: test-runner }
    entrypoint: ["sleep", "infinity"]
    environment:
      SSL_CERT_FILE: /run/secrets/step_ca_root
      VAULT_ADDR: https://vault.mnemo.local:8200
      VAULT_CACERT: /run/secrets/step_ca_root
      VAULT_TOKEN_FILE: /run/secrets/vault_app_token
      # DEFAULT LLM path: host-Metal ollama via the host-llm-proxy relay. test-runner
      # already holds edge (direct host access), so hostllm only resolves the relay
      # alias — no new privilege. In-VM fallback = 'in-vm-llm' profile
      # (OLLAMA_URL: http://ollama.mnemo.local:11434).
      OLLAMA_URL: http://host-llm.mnemo.local:11434
    secrets: [step_ca_root, vault_app_token, pgpass_consolidator, pgpass_app]
    volumes:
      # identical absolute paths inside and out so evidence artifacts stay portable
      - ../:/Users/admin/Mnemosyne
      - ${MNEMO_CUSTODY_DIR:-/secure/outside/repo-custody}:${MNEMO_CUSTODY_DIR:-/secure/outside/repo-custody}
    # exec: the suite writes stub provider/tool executables to pytest tmp_path
    # under /tmp; the default docker tmpfs noexec flag breaks them (that was the
    # bulk of the prior row-10 environmental failures).
    tmpfs: ["/tmp:exec,size=512m,mode=1777"]
    networks: [edge, internal, datasec, hostllm]   # hostllm: sanctioned client of the default host-llm relay

secrets:
  pg_superuser_pw: { file: "${MNEMO_SECRETS_DIR:-/secure/outside/repo}/pg_superuser_pw" }
  mcp_bearer_token: { file: "${MNEMO_SECRETS_DIR:-/secure/outside/repo}/mcp_bearer_token" }
  grafana_admin_pw: { file: "${MNEMO_SECRETS_DIR:-/secure/outside/repo}/grafana_admin_pw" }
  kc_db_pw: { file: "${MNEMO_SECRETS_DIR:-/secure/outside/repo}/kc_db_pw" }
  app_db_pw: { file: "${MNEMO_SECRETS_DIR:-/secure/outside/repo}/app_db_pw" }
  consolidator_db_pw: { file: "${MNEMO_SECRETS_DIR:-/secure/outside/repo}/consolidator_db_pw" }
  eval_db_pw: { file: "${MNEMO_SECRETS_DIR:-/secure/outside/repo}/eval_db_pw" }
  pgpass_app: { file: "${MNEMO_SECRETS_DIR:-/secure/outside/repo}/pgpass_app" }
  pgpass_consolidator: { file: "${MNEMO_SECRETS_DIR:-/secure/outside/repo}/pgpass_consolidator" }
  step_ca_root: { file: "${MNEMO_SECRETS_DIR:-/secure/outside/repo}/step-ca-root.crt" }
  vault_app_token: { file: "${MNEMO_SECRETS_DIR:-/secure/outside/repo}/vault_app_token" }
  # B3 mTLS: step-ca client leaf (leaf+intermediate bundle) + unencrypted key,
  # mounted into the operator/soak client that presents them to the
  # require_and_verify mcp.mnemo.local ingress.
  mcp_client_cert: { file: "${MNEMO_SECRETS_DIR:-/secure/outside/repo}/mcp-client.crt" }
  mcp_client_key: { file: "${MNEMO_SECRETS_DIR:-/secure/outside/repo}/mcp-client.key" }
  # B9 parametric-tier serving: SeaweedFS object identity so parametric-http can
  # load the deployed adapter artifact by content hash (least-privilege R/W/List).
  seaweed_s3: { file: "${MNEMO_SECRETS_DIR:-/secure/outside/repo}/seaweed-s3.json" }
