# Mnemosyne Postgres performance tuning candidate.
#
# Sized for the post-apply runtime target in infra/PERF-RUNTIME.md:
# - Colima VM: 6 CPU / 12 GiB
# - postgres service ceiling: 2 CPU / 2 GiB
#
# Do not apply silently. Capture the pre-change baseline first, apply these
# exact values in one controlled operator run, then retain the before/after
# rows with load average, container limits, Postgres version, and query mix.
# PostgreSQL command-line -c flags override postgresql.conf and ALTER SYSTEM,
# so an operator can apply this file's values as equivalent -c name=value
# arguments during the evidence-gated runtime flip.

# Existing compose defaults, kept here so the performance profile has one
# reviewed source even while docker-compose.prod.yml remains the running owner.
shared_buffers = 512MB
maintenance_work_mem = 512MB

# Autovacuum workers otherwise inherit maintenance_work_mem each (default 3
# workers x 512MB + shared_buffers > the 2 GiB service ceiling). Bound them
# separately; manual index builds keep the full maintenance_work_mem.
autovacuum_work_mem = 128MB

# Per sort/hash operation, and per parallel worker. Keep this conservative
# inside the 2 GiB container cap.
work_mem = 16MB

# Planner estimate only; does not allocate memory. Sized below the 2 GiB
# container ceiling to reflect shared_buffers plus the container's page cache.
effective_cache_size = 1536MB

# The hot OLTP/vector path should not fan out aggressively inside a 2 CPU
# container. Analytic checks may still get one helper worker.
max_parallel_workers_per_gather = 1

# Short OLTP-style retrieval queries should not pay LLVM JIT startup cost.
jit = off

# hnsw.ef_search stays query-local in PostgresEngine._set_pgvector_hnsw_query_settings.
# Do not set it globally here; fast and deep routes intentionally use different
# values and tests pin the transaction-local GUC ordering.
