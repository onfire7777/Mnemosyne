groups:
  - name: mnemosyne-production-tripwires
    interval: 30s
    rules:
      - alert: MnemosyneOpsReportStale
        # absent() guard: before the metrics-pusher role existed this rule
        # silently watched a nonexistent series and could never fire.
        expr: (time() - mnemosyne_ops_report_timestamp_seconds > 300) or absent(mnemosyne_ops_report_timestamp_seconds)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Mnemosyne ops report timestamp is stale or missing
      - alert: MnemosyneReleaseGateOpen
        expr: mnemosyne_release_gate_open == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Mnemosyne production release gate is open
  - name: mnemosyne-worker-health
    interval: 60s
    rules:
      # Worker death/restart detection: a dead or wedged consolidator stops
      # draining the tenant queue, so dead jobs or a stalled backlog are the
      # observable signal (container restarts are not exported to the store).
      - alert: MnemosyneQueueDeadJobs
        expr: mnemosyne_queue_dead > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Tenant {{ $labels.tenant }} queue has dead jobs; worker processing is failing"
      - alert: MnemosyneQueueBacklogStalled
        expr: mnemosyne_queue_queued > 0 and (mnemosyne_queue_queued - (mnemosyne_queue_queued offset 10m)) >= 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Tenant {{ $labels.tenant }} queue backlog is not draining; worker may be down or restart-looping"
  - name: mnemosyne-tls-lifecycle
    interval: 60s
    rules:
      # Chain/hostname mismatch or endpoint down: the probe pins the step-ca
      # root and verifies the served hostname, so probe_success == 0 covers
      # cert-mismatch, broken chain, and unreachable ingress.
      - alert: MnemosyneTlsProbeFailed
        expr: probe_success{job="blackbox-tls"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "TLS probe failed for {{ $labels.instance }} (chain, hostname, or endpoint)"
      # Caddy renews the 24h step-ca ACME leafs around 2/3 lifetime (~8h
      # remaining). Under 6h remaining means automated renewal is late.
      - alert: MnemosyneTlsCertExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry{job="blackbox-tls"} - time()) < 6 * 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate for {{ $labels.instance }} expires in <6h; automated renewal is late"
      # Under 2h remaining renewal has effectively failed; serving will break.
      - alert: MnemosyneTlsRenewalFailed
        expr: (probe_ssl_earliest_cert_expiry{job="blackbox-tls"} - time()) < 2 * 3600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "TLS renewal failed for {{ $labels.instance }}; certificate expires in <2h"
      # Revocation posture for this profile is max-lifetime enforcement:
      # 24h leafs bound any revocation window by construction. A served
      # certificate with >26h remaining violates that posture.
      - alert: MnemosyneTlsLongLivedCertDetected
        expr: (probe_ssl_earliest_cert_expiry{job="blackbox-tls"} - time()) > 26 * 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Served certificate for {{ $labels.instance }} exceeds the 24h short-lived policy"
