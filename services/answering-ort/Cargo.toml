[package]
name = "answering-ort"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
onnx = ["dep:ort", "dep:sha2"]

[dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-27"], optional = true }
sha2 = { version = "0.10", optional = true }
num_cpus = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
path = "src/lib.rs"

[[bin]]
name = "answering-ort"
path = "src/main.rs"
