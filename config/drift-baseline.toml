# Drift-detection baseline — the "Declared" view (see ../CONFIG-DRIFT-CHECKS.md).
#
# This file records the EXPECTED SHAPE of configuration so the drift checks in
# tests/test_config_drift.py can compare the running code surface against it. It
# does NOT define rail/guardrail VALUES, tuning ranges, or schemas — those remain
# owned by the v2 blueprint (§19, §31, §23.5) and src/mnemosyne/policy.py /
# src/mnemosyne/security.py.
#
# Mirror discipline: when the code intentionally changes a rail, tunable, store,
# or authority contract, update this baseline in the SAME commit. An un-mirrored
# change is exactly what the drift checks catch.

schema_version = 1

[policy]
module = "mnemosyne.policy"
object = "OperatingPolicy"

[rails]
# Boolean invariant rails. Every name must exist on OperatingPolicy.immutable_rails
# and be enabled (True). Semantics/ownership: §31, §23.5.
required = [
  "retrieved_text_is_data_not_instruction",
  "writes_are_append_only_or_superseding",
  "tenant_isolation_required",
  "source_trust_filter_required",
  "sensitive_and_destructive_writes_audited",
  "branch_promotion_requires_gate",
  "explicit_preferences_outrank_inferred",
  "erasure_propagates_to_derived_indexes",
  "learning_reward_external_only",
  "learning_salience_only",
  "learning_after_access_policy",
  "learning_changes_reversible",
  "learning_bounded_steps",
  "labile_updates_are_new_revisions",
  "learning_freeze_on_regression",
  "learning_tenant_scoped",
  "learned_effects_need_approval",
  "erasure_cascades_to_learning",
  "credit_requires_contingency",
  "no_use_only_strengthening",
  "exploration_never_zero",
  "symmetric_updates",
  "goal_check_on_every_serve",
  "reward_sources_allowlisted",
  "replay_requires_new_evidence",
  "scope_grows_by_evidence_only",
  "retired_stays_retired",
  "evidence_never_labile",
  "predictions_write_once",
  "slow_store_revisions_only",
  "single_learning_write_path",
  "learning_failures_are_defects",
]

[rails.security]
# Security-mediated subset enforced by SecurityPolicy.immutable_rails.
required = [
  "tenant_isolation_required",
  "retrieved_text_is_data_not_instruction",
  "source_trust_filter_required",
  "branch_promotion_requires_gate",
  "erasure_propagates_to_derived_indexes",
]

[rails.numeric]
# §31/§23.5 immutable mutation-rate rails. The cold loop tunes WITHIN these and can
# never widen them, so their VALUES (not just names) are drift-critical. These are
# the blueprint values; CC-LS exposes them as live constants on OperatingPolicy
# (parity item #22) and the drift test then pins live == declared.
max_supersession_rate = 0.05        # fraction of active facts supersedable per pass
min_corroboration_for_delete = 2    # independent sources before hard delete
max_prune_fraction_per_pass = 0.02  # fraction of memory prunable per pass

[tunables]
# Knobs that may move WITHIN rails (§31). Each name must exist on OperatingPolicy.
# The authoritative tuning range lives in §31; the defaults below snapshot the
# current shipped values so the checks detect an un-mirrored default change.
names = [
  "top_k",
  "deep_top_k",
  "token_budget",
  "rrf_k",
  "rerank_width",
  "mmr_lambda",
  "abstention_threshold",
  "max_trust_tier",
  "max_sensitivity",
  "decay",
  "activation_weights",
]

[tunables.defaults]
top_k = 8
deep_top_k = 24
token_budget = 4096
rrf_k = 60
rerank_width = 32
mmr_lambda = 0.72
abstention_threshold = 0.45
max_trust_tier = 4
max_sensitivity = 3
decay = 0.5

# base_level credits outcome-backed cited demand only, never raw retrievals.
[tunables.activation_weights]
base_level = 0.35
semantic = 0.35
importance = 0.20
recency = 0.10

[authority]
# Write authority is mediated. These operations require the consolidator/operator
# role (SecurityPolicy.consolidator_only_ops). Names mirror the code contract.
consolidator_only_ops = [
  "run_consolidation_passes",
  "promote_candidate",
  "prune_memory",
  "demote_fidelity",
  "write_inferred_preference",
  "write_policy_variant",
]
# Sinks only an operator may write — encodes "untrusted_to_system_prompt: forbidden" (§31).
operator_only_sinks = ["policy", "system_prompt", "safety_rail"]

[reward]
# reward_signal: external_only (§31). The reward sources self-optimization accepts.
external_sources = ["external_eval", "human_feedback", "protected_suite"]

[topology]
# Selects which backing-service expectations apply (§32). Default is local-first.
default_backend = "local"
backend_env = "MNEME_BACKEND"
postgres_dsn_env = "MNEMOSYNE_POSTGRES_DSN"
# Recognized storage backends. "sqlite" (one file per tenant) is a self-hosted
# lane alongside local/postgres. NOTE: production topology remains Postgres-only
# (§32) — a production/postgres profile running SqliteEngine is check-D
# environment drift, the same as a production instance pointing at the JSON store.
backends = ["local", "postgres", "sqlite"]

[schema]
# Stores the system depends on must exist in sql/schema.sql (§19). Drift = a
# renamed or dropped store. This lists table NAMES only; column/type definitions
# stay in sql/schema.sql.
required_tables = [
  "tenants",
  "branches",
  "evidence",
  "assertions",
  "justifications",
  "entities",
  "entity_aliases",
  "relations",
  "graph_ppr_cache",
  "contradictions",
  "procedures",
  "lessons",
  "preferences",
  "user_latent",
  "trajectories",
  "self_model",
  "mental_models",
  "knowledge_pages",
  "observations",
  "documents",
  "eval_cases",
  "resources",
  "merges",
  "deletion_log",
  "conformal_calibration",
  "audit_log",
  "runtime_jobs",
  "runtime_state",
  "learning_receipts",
  "learning_episodes",
  "learning_credit",
  "learning_stats",
  "learning_artifacts",
  "learning_defects",
  "learning_policy_state",

  "working_memory",
  "intentions",
  "intention_firing_receipts",
  "intention_firing_receipts_v2",
]

[learning.defaults]
learning_enabled = true
learning_distill_mode = "deterministic"
learning_trace_lambda = 0.7
learning_trace_tau_minutes = 30
learning_resolution_window_minutes = 180
learning_exploration_rate = 0.1
learning_exploration_floor = 0.02
learning_probation_outcomes = { schema = 5, standalone = 12 }
learning_interleave_fraction = 0.3
learning_homeostasis_budget = 0.08
learning_contingency_min_samples = 8
learning_goal_check_comparison_rate = 0.05
