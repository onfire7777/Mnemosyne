[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "mnemosyne-native"
# Version has a single source of truth: Cargo.toml [package].version.
# maturin resolves `dynamic = ["version"]` from there at build time.
dynamic = ["version"]
description = "Byte-parity native kernels for Mnemosyne (optional accelerator)"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

[tool.maturin]
module-name = "mnemosyne_native"
